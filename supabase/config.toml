# Supabase project configuration (functions only).
# The full config lives on the hosted project; this file carries only the
# settings the deploy command needs.

[functions.site-subscribe]
verify_jwt = false

# RevenueCat calls it with no Supabase JWT; it checks REVENUECAT_WEBHOOK_AUTH
# itself when set, and grants only what RevenueCat's API confirms.
[functions.revenuecat-webhook]
verify_jwt = false

# Called by the app with the signed-in (or anonymous) user's token.
[functions.pass-sync]
verify_jwt = true

# Apple's Retention Messaging calls it with no Supabase JWT; it checks Apple's
# own signature on the request instead.
[functions.retention-message]
verify_jwt = false

# The web funnel's pages call it with no Supabase JWT until she has given her
# email, and with her own token after (checked by the function itself); it
# forwards three page events to Meta, and answers 204 until the pixel is set.
[functions.meta-capi]
verify_jwt = false

# The funnel calls it with the buyer's own token (anonymous included), which
# the function checks itself with Supabase Auth: that works whichever keys the
# project signs with, and its 401 carries the CORS headers the page can read.
[functions.web-account]
verify_jwt = false

# pg_cron and revenuecat-webhook call it with EMAIL_CRON_SECRET, not a JWT.
[functions.web-email]
verify_jwt = false
