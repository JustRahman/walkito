# The web funnel at start.walkito.site: a Vite build, uploaded as files.
# Lives on the same droplet as walkito.site, in /var/www/walkito-start.
#
#   cp funnel/deploy/start.walkito.site.conf /etc/nginx/sites-available/start.walkito.site
#   ln -s /etc/nginx/sites-available/start.walkito.site /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d start.walkito.site
# (Certbot rewrites this file to add the :443 block and the redirect.)

server {
    server_name start.walkito.site;

    root /var/www/walkito-start;
    index index.html;
    charset utf-8;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # One page app: every path that is not a file is the app, which routes
    # /s/1, /s/18, /terms and the rest itself.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Hashed build output: cached forever.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Clips, posters, photos: not hashed, so a month.
    location ~* \.(mp4|webp|png|jpg|jpeg|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Source maps stay on the server for us, not for the public.
    location ~* \.map$ { return 404; }

    listen 80;
    listen [::]:80;
}
