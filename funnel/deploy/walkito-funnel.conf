# The web funnel (funnel/ in the repo) at https://walkito.site/go/: a Vite
# build uploaded as files to /var/www/walkito-funnel/go, separate from the
# site's own /var/www/walkito so neither deploy can delete the other.
#
# Installed as /etc/nginx/snippets/walkito-funnel.conf and included from the
# walkito.site :443 server block, right under its server_name:
#
#     include snippets/walkito-funnel.conf;
#
#   nginx -t && systemctl reload nginx

location = /go { return 301 /go/; }

location ^~ /go/ {
    root /var/www/walkito-funnel;
    # One page app: every path that is not a file is the app (/go/s/1, /go/terms…).
    try_files $uri /go/index.html;
    add_header Cache-Control "no-cache" always;
    # Never kept at Cloudflare's edge: a deploy shows at once.
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex" always;

    # Hashed build output: cached forever.
    location ^~ /go/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Clips, posters, photos: not hashed, so a month.
    location ~* \.(mp4|webp|png|jpg|jpeg|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Source maps stay with us.
    location ~* \.map$ { return 404; }
}
